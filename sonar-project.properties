sonar.projectKey=Cifrados_proyecto2
sonar.projectName=Cifrados_proyecto2
# fase1 = linea base; fase2 = analisis despues de las correcciones.
# Con New Code = Previous version, el cambio de version marca el codigo nuevo.
sonar.projectVersion=fase2

sonar.host.url=http://localhost:9000
# El token NO va aqui: usar la variable de entorno SONAR_TOKEN.

sonar.sourceEncoding=UTF-8
sonar.sources=app.js,app.py,vite.config.js,index.html,src
sonar.tests=src/tests
sonar.test.inclusions=src/tests/**/*.test.js

sonar.exclusions=node_modules/**,dist/**,build/**,coverage/**,.scannerwork/**,src/tests/**,src/assets/**,public/**,docs/**

# Cobertura generada con: npm run test:coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=vite.config.js,index.html

# Hallazgos de Semgrep: semgrep scan --config p/default --sarif --output semgrep.sarif
sonar.sarifReportPaths=semgrep.sarif
