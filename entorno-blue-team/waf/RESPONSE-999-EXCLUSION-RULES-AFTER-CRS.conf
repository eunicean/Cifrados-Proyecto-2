# Exclusiones del CRS para falsos positivos (Hito 3).
#
# Cada exclusion debe documentarse en docs/hito-3 con: peticion legitima bloqueada,
# regla que la disparo (id), por que es falso positivo y por que la exclusion es la minima posible.
#
# Ejemplo (NO activado): los mensajes viajan cifrados en base64 y podrian disparar reglas
# de deteccion de payloads. Excluir solo esos campos y solo en POST /api/messages:
#
# SecRule REQUEST_FILENAME "@streq /api/messages" \
#     "id:1001,phase:2,pass,nolog,\
#     ctl:ruleRemoveTargetByTag=attack-injection-generic;ARGS:json.ciphertext_base64,\
#     ctl:ruleRemoveTargetByTag=attack-injection-generic;ARGS:json.auth_tag_base64"
