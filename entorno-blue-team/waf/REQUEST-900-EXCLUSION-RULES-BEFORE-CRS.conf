# =====================================================================
# Reglas propias que se cargan ANTES del OWASP CRS (Hito 3)
# =====================================================================
# Por que en este archivo y no en RESPONSE-999:
#   Las exclusiones en tiempo de ejecucion (ctl:ruleRemoveTargetBy...) solo afectan a
#   las reglas que se evaluan DESPUES de ellas. Si se ponen en RESPONSE-999 (despues del
#   CRS), las reglas 94x del CRS ya se ejecutaron y la exclusion no tiene efecto.
#   RESPONSE-999 queda para exclusiones en tiempo de configuracion (SecRuleUpdateTargetById).
#
# Rango de IDs propio: 10000-10999. Cada regla esta documentada en docs/hito-3/README.md.
# =====================================================================


# ---------------------------------------------------------------------
# 10010 · Parche virtual PoC-02 (CA-07): busqueda de grupos con comodines o canales directos
# ---------------------------------------------------------------------
# El CRS no tiene firma para esta falla de logica: `?name=%` y `?name=direct` son
# peticiones "limpias". Mientras llega la correccion en codigo (H4), el WAF las corta.
#   - % * \  -> comodines de LIKE/PostgREST
#   - :      -> solo aparece en nombres de canal "direct:<id>:<id>"; GROUP_NAME_PATTERN
#               (app.js) no permite ":" en grupos legitimos, asi que no hay falso positivo
#   - direct -> la palabra exacta usada en el PoC
# NO se bloquea "_" porque los grupos legitimos pueden llamarse "Grupo_1" (falso positivo).
# Limitacion conocida: busquedas como "irect" o un fragmento de UUID siguen devolviendo
# canales directos. Por eso este parche es contencion, no correccion (ver H4, RS-05).
SecRule REQUEST_FILENAME "@streq /api/groups/search" \
    "id:10010,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    auditlog,\
    msg:'Parche virtual PoC-02: comodin o canal directo en la busqueda de grupos',\
    logdata:'name=%{MATCHED_VAR}',\
    tag:'cifrados/virtual-patch',\
    tag:'cifrados/poc-02',\
    severity:'WARNING',\
    chain"
    SecRule ARGS_GET:name "@rx (?:[%*:\x5c]|^\s*direct\s*$)" \
        "t:none,t:lowercase"


# ---------------------------------------------------------------------
# Exclusiones por falsos positivos (con evidencia, PARANOIA=2, 2026-11-17)
# ---------------------------------------------------------------------
# Trafico legitimo en el navegador (registro, login, mensajes de grupo y directos) con
# WAF_PARANOIA=2, analizado con scripts/blue-team/falsos-positivos.mjs. Con PARANOIA=1
# el mismo flujo no genero ninguna alerta. Detalle en docs/hito-3/README.md, seccion 4.3.
#
# Criterio: una ruta, un metodo, los campos afectados y SOLO la regla que disparo.
# El resto del CRS sigue inspeccionando esos campos.

# 10110 · FP-01: llave publica PEM en el registro.
#   Evidencia: POST /api/auth/register 201, regla 942430 (Restricted SQL Character Anomaly
#   Detection, 12+ caracteres especiales) en ARGS:json.public_key.
#   Por que es FP: un PEM es base64 con '+', '/', '=' y guiones de cabecera; la API lo
#   guarda tal cual como texto (consulta parametrizada) y nunca lo interpreta.
SecRule REQUEST_FILENAME "@streq /api/auth/register" \
    "id:10110,\
    phase:1,\
    pass,\
    nolog,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "ctl:ruleRemoveTargetById=942430;ARGS:json.public_key"

# 10120 · FP-02: campos base64 de los mensajes cifrados.
#   Evidencia: POST /api/messages 201, regla 942120 (SQL Operator Detected) en
#   ARGS:json.ciphertext_base64 y ARGS:json.auth_tag_base64; sumada la puntuacion,
#   949110 (umbral de anomalia) => en modo On el mensaje se BLOQUEARIA (403).
#   Por que es FP: son bytes aleatorios codificados en base64 (salida de AES-GCM). Por
#   azar contienen secuencias que parecen operadores SQL entre '/' o '+'. La API los
#   guarda como texto opaco con consultas parametrizadas.
#   nonce_base64 y signature_base64 son del mismo tipo (base64 de bytes aleatorios) y se
#   incluyen para no repetir el mismo FP con otro mensaje; se excluye solo la regla 942120.
SecRule REQUEST_FILENAME "@streq /api/messages" \
    "id:10120,\
    phase:1,\
    pass,\
    nolog,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "ctl:ruleRemoveTargetById=942120;ARGS:json.ciphertext_base64,\
        ctl:ruleRemoveTargetById=942120;ARGS:json.auth_tag_base64,\
        ctl:ruleRemoveTargetById=942120;ARGS:json.nonce_base64,\
        ctl:ruleRemoveTargetById=942120;ARGS:json.signature_base64"

