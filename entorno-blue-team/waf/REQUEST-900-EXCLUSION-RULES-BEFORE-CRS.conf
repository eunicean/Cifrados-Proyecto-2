# Reglas propias que se cargan ANTES del OWASP CRS (Hito 3).
# Las exclusiones en tiempo de ejecucion (ctl:ruleRemoveTargetBy...) solo afectan a las
# reglas que se evaluan despues, por eso van aqui y no en RESPONSE-999.
# Rango de IDs propio: 10000-10999.

# 10010 · Parche virtual PoC-02: busqueda de grupos con comodines o canales directos.
#   % * \  -> comodines de LIKE/PostgREST
#   :      -> solo existe en canales "direct:<id>:<id>"; los grupos no pueden tenerlo
#   direct -> la palabra usada en el PoC
# No se bloquea "_" porque un grupo legitimo puede llamarse "Grupo_1".
SecRule REQUEST_FILENAME "@streq /api/groups/search" \
    "id:10010,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    auditlog,\
    msg:'Parche virtual PoC-02: comodin o canal directo en la busqueda de grupos',\
    logdata:'name=%{MATCHED_VAR}',\
    tag:'cifrados/virtual-patch',\
    tag:'cifrados/poc-02',\
    severity:'WARNING',\
    chain"
    SecRule ARGS_GET:name "@rx (?:[%*:\x5c]|^\s*direct\s*$)" \
        "t:none,t:lowercase"

