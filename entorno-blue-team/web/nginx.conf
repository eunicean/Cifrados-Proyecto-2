server {
    listen 80;
    server_name _;
    server_tokens off;

    # La IP real del cliente la entrega el WAF en X-Forwarded-For.
    # Solo se confia en proxies de la red interna de Docker.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;

    root /usr/share/nginx/html;
    index index.html;

    # Mismos encabezados que vite.config.js (securityHeaders). La CSP completa va en <meta> del build.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # API: /api/xyz -> http://api:3001/xyz
    location /api/ {
        proxy_pass http://api:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Un solo valor: app.js usa trust proxy = 1 y el rate limit depende de esta IP
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: rutas del frontend caen en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
