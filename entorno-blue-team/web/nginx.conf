# Hito 3: limites de frecuencia en el borde (contencion de PoC-04 y PoC-05).
# Este archivo se incluye dentro del bloque `http`, por eso las zonas van aqui arriba.

# PoC-04: fuerza bruta del codigo de grupo. 6 por minuto por IP, rafaga de 5.
limit_req_zone $binary_remote_addr zone=cif_join:10m rate=6r/m;

# PoC-05: inundacion de mensajes. Solo se limita POST.
map $request_method $cif_post_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $cif_post_key zone=cif_messages:10m rate=60r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;

    # La IP real del cliente la entrega el WAF en X-Forwarded-For.
    # Solo se confia en proxies de la red interna de Docker.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;

    root /usr/share/nginx/html;
    index index.html;

    limit_req_status 429;
    limit_req_log_level warn;

    # Comunes a todas las locations que hacen proxy a la API
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Un solo valor: app.js usa trust proxy = 1 y el rate limit depende de esta IP
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Mismos encabezados que vite.config.js. La CSP completa va en <meta> del build.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # PoC-04: /api/groups/<id>/join -> http://api:3001/groups/<id>/join
    location ~ ^/api/groups/[^/]+/join$ {
        limit_req zone=cif_join burst=5 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:3001;
    }

    # PoC-05: POST /api/messages -> http://api:3001/messages
    location = /api/messages {
        limit_req zone=cif_messages burst=20 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api:3001;
    }

    # API: /api/xyz -> http://api:3001/xyz
    location /api/ {
        proxy_pass http://api:3001/;
    }

    # SPA: rutas del frontend caen en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}